name: Dealership CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q server

      - name: Validate JavaScript syntax
        run: |
          node --check server/database/app.js
          node --check server/database/dealership.js
          node --check server/database/review.js

      - name: Confirm CI completion
        run: echo "All dealership CI validation steps passed."
